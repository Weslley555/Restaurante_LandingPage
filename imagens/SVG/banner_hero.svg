  <title id="h-title">Almoço caseiro à mesa</title>
  <desc id="h-desc">Vista superior de uma mesa de madeira mel com prato de cerâmica, arroz soltinho, feijão ao caldo, carne grelhada com cebola e salada de folhas e tomates. Guardanapo de linho vinho, talheres, farofa e suco completam a refeição.</desc>
