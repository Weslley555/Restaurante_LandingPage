  <title id="d-title">Marmita caseira, pronta para servir</title>
  <desc id="d-desc">Marmita aberta de fibra natural, vista de cima em leve perspectiva, com arroz, feijão, tiras de carne acebolada e legumes em divisórias. Salada e farofa em potinhos, talheres de madeira e guardanapo vinho acompanham a embalagem sem marca.</desc>
