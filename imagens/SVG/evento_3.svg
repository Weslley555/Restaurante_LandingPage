  <title id="e3-title">Uma mesa para celebrar</title>
  <desc id="e3-desc">Ilustração conceitual de comemoração intimista: bolo com frutas, pequenas velas, flores e doces sobre uma toalha de linho, sob bandeirolas discretas. Não retrata instalações ou serviços reais.</desc>
