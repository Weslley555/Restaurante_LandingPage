<svg width="111" height="120" viewBox="0 0 111 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="111" height="120" rx="12" fill="white"/>
  <!-- Confetti -->
  <rect x="20" y="15" width="4" height="4" rx="1" fill="#F0C040" transform="rotate(30 20 15)" opacity="0.7"/>
  <rect x="82" y="20" width="4" height="4" rx="1" fill="#6a0909" transform="rotate(-20 82 20)" opacity="0.7"/>
  <rect x="30" y="10" width="3" height="3" rx="0.5" fill="#5B8C3E" transform="rotate(45 30 10)" opacity="0.6"/>
  <rect x="75" y="12" width="3" height="3" rx="0.5" fill="#E8724A" transform="rotate(15 75 12)" opacity="0.6"/>
  <circle cx="88" cy="35" r="2" fill="#F0C040" opacity="0.5"/>
  <circle cx="22" cy="30" r="2" fill="#6a0909" opacity="0.5"/>
  <!-- Cake base -->
  <rect x="33" y="52" width="44" height="14" rx="3" fill="#FCEBD5"/>
  <rect x="33" y="52" width="44" height="4" rx="2" fill="#E8724A"/>
  <!-- Cake middle layer -->
  <rect x="37" y="38" width="36" height="16" rx="3" fill="#FFF3F3"/>
  <rect x="37" y="38" width="36" height="4" rx="2" fill="#F0C040"/>
  <!-- Cake top layer -->
  <rect x="42" y="28" width="26" height="12" rx="3" fill="#FCEBD5"/>
  <rect x="42" y="28" width="26" height="4" rx="2" fill="#6a0909"/>
  <!-- Candles -->
  <rect x="49" y="20" width="2" height="10" rx="1" fill="#F0C040"/>
  <ellipse cx="50" cy="18" rx="2" ry="3" fill="#FF6B35" opacity="0.9">
  </ellipse>
  <rect x="57" y="22" width="2" height="8" rx="1" fill="#E8724A"/>
  <ellipse cx="58" cy="20" rx="2" ry="3" fill="#FF6B35" opacity="0.8">
  </ellipse>
  <!-- Cake plate -->
  <ellipse cx="55" cy="66" rx="28" ry="4" fill="#DDD" opacity="0.5"/>
  <!-- Text -->
  <text x="55" y="84" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="700" font-size="11" fill="#333">Festas</text>
  <text x="55" y="98" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="400" font-size="9" fill="#888">e Eventos</text>
</svg>
