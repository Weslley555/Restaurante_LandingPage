  <title id="p1-title">Prato feito com carne acebolada</title>
  <desc id="p1-desc">Prato de cerâmica creme com borda vinho, visto de cima, servido com arroz de grãos soltos, feijão ao caldo, bife acebolado e salada de alface, tomate e pepino. Talheres repousam sobre uma mesa clara com guardanapo de linho.</desc>
