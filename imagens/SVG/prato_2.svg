  <title id="p2-title">Frango dourado com arroz e legumes</title>
  <desc id="p2-desc">Travessa oval de cerâmica terracota com frango grelhado em fatias, arroz com ervilhas, brócolis, cenoura, abobrinha e uma cunha de limão. Composição vista de cima sobre madeira mel, com linho creme e talher de cabo vinho.</desc>
