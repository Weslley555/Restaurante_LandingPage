<svg xmlns="http://www.w3.org/2000/svg" width="280" height="180" viewBox="0 0 280 180" fill="none" role="img" aria-labelledby="p3-title p3-desc" lang="pt-BR">
  <title id="p3-title">Pudim caseiro com calda de caramelo</title>
  <desc id="p3-desc">Pudim de leite em forma de anel canelado, visto em três quartos, com superfície âmbar brilhante e fios de caramelo sobre as laterais douradas. Calda espalhada em prato de cerâmica creme com borda vinho, uma colher e um pequeno ramo de hortelã sobre linho.</desc>
