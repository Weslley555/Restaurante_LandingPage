<!doctype html>
<html>
    <head>
        <title>Terreiro do Vovô</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="content-container-esquerda">
            <div class="cabecalho-logo">
                <img
                    src="imagens/logo.png"
                    alt="Logo Terreiro do Vovô"
                    class="imagem-logo"
                />
            </div>

            <div class="textos-chamativos">
                <h2 class="titulo-destaque">
                    Comida caseira e deliciosa?<br />É no Terreiro do Vovô
                </h2>
                <p class="mini-texto">
                    Do restaurante até a sua casa, vem conhecer nossos serviços.
                </p>
            </div>

            <!-- BOTÕES DE NAVEGAÇÃO -->
            <nav class="navegacao-servicos">
                <!-- Botão 1: Self Service -->
                <div class="div-botao">
                    <a href="#self-service">
                        <img
                            src="imagens/almoco_b.png"
                            alt="Ir para Self Service"
                            class="img-botao"
                        />
                    </a>
                </div>

                <!-- Botão 2: Delivery -->
                <div class="div-botao">
                    <a href="#delivery">
                        <img
                            src="imagens/delivery_b.png"
                            alt="Ir para Delivery"
                            class="img-botao"
                        />
                    </a>
                </div>

                <!-- Botão 3: Eventos -->
                <div class="div-botao">
                    <a href="#eventos">
                        <img
                            src="imagens/festas_b.png"
                            alt="Ir para Festas e Eventos"
                            class="img-botao"
                        />
                    </a>
                </div>
            </nav>
        </div>

        <div class="content-container-direita">
            <div class="secao inicio">
                <h2>Área da Imagem Principal</h2>
            </div>

            <hr class="separador-secao" />

            <div class="secao azul" id="self-service">
                <h2>Self Service</h2>
            </div>

            <hr class="separador-secao" />

            <div class="secao verde" id="delivery">
                <h2>Delivery</h2>
            </div>

            <hr class="separador-secao" />

            <div class="secao roxa" id="eventos">
                <h2>Eventos</h2>
            </div>
        </div>

        <footer class="rodape-minimalista">
            <span>&copy; 2026 Terreiro do Vovô</span>
            <span class="separador">|</span>
            <a href="#contato">Contato</a>
            <a href="#social">Social</a>
            <a href="termos-de-uso.html">Termos de Uso</a>
            <a href="politica-de-privacidade.html">Política de Privacidade</a>
        </footer>
    </body>
</html>
